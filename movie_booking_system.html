<!DOCTYPE html>1
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- 側邊欄 -->
        <aside class="sidebar">
            <h1 class="logo">萎鏽電影</h1>
            <ul>
                <li><button onclick="navigateTo('Booking')">訂票</button></li>
                <li><button onclick="navigateTo('Introducing')">電影介紹</button></li>
                <li><button onclick="navigateTo('schedule')">電影時刻查詢</button></li>
                <li><button onclick="navigateTo('membership')">會員查詢</button></li>
            </ul>
        </aside>

        <!-- 內容區域 -->
        <main class="content">
            <!-- 訂票 -->
            <div id="Booking" class="page">
                <h2>訂票</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="location">
                            <i class="fas fa-map-marker-alt"></i> 請選擇影城
                        </label>
                        <select id="location" required>
                            <option value="">請選擇影城</option>
                            <option value="1">台北影城</option>
                            <option value="2">台中影城</option>
                            <option value="3">高雄影城</option>
                        </select>
                    </div>
            
                    <div class="form-group">
                        <label for="movie">
                            <i class="fas fa-film"></i> 請選擇影片
                        </label>
                        <select id="movie" required>
                            <option value="">請選擇影片</option>
                            <option value="ironman">鋼鐵人</option>
                            <option value="spiderman">蜘蛛人</option>
                            <option value="captain">美國隊長</option>
                        </select>
                    </div>
            
                    <div class="form-group">
                        <label for="date">
                            <i class="fas fa-calendar-alt"></i> 請選擇日期
                        </label>
                        <input type="date" id="date" required />
                    </div>
            
                    <div class="form-group">
                        <label for="time">
                            <i class="fas fa-clock"></i> 請選擇場次
                        </label>
                        <select id="time" required>
                            <option value="">請選擇場次</option>
                            <option value="10:00">10:00</option>
                            <option value="14:00">14:00</option>
                            <option value="18:00">18:00</option>
                        </select>
                    </div>
            
                    <div class="buttons">
                        <button type="button" onclick="goToBooking()">前往訂票</button>
                        <button type="button" onclick="checkSeats()">查看座位</button>
                    </div>
                </form>
            </div>
            <!-- 電影介紹 -->
            <div id="Introducing" class="page active">
                <div id="movies" class="movies"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
