<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- 側邊欄 -->
        <aside class="sidebar">
            <h1 class="logo">萎鏽電影</h1>
            <h2>功能選單</h2>
            <ul>
                <li><button onclick="navigateTo('Booking')">訂票</button></li>
                <li><button onclick="navigateTo('Introducing')">電影介紹</button></li>
                <li><button onclick="navigateTo('schedule')">電影時刻查詢</button></li>
                <li><button onclick="navigateTo('membership')">會員查詢</button></li>
            </ul>
        </aside>

        <!-- 內容區域 -->
        <main class="content">
            <!-- 搜尋欄 -->
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="輸入電影名稱搜尋..."
                    oninput="filterMovies()"
                />
            </div>
            <div id="Introducing" class="page active">
                <!-- 原有的訂票內容 -->
                <div id="movies" class="movies"></div>
            </div>
                
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
